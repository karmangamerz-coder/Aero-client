name: Format Rust once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v1-milestones
      - name: Install pinned formatter
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native
          git diff --cached --quiet || git commit -m "style: format Rust sources"
          git push origin HEAD:codex/v1-milestones
