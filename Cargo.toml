[workspace]
members = ["native/core", "native/launcher"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
futures-util = "0.3"
zip = { version = "6", default-features = false, features = ["deflate"] }
fs2 = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.metadata.packager]
# Production NSIS installer implementation remains M9.
product-name = "Aero Client"
identifier = "org.aeroclient.launcher"
