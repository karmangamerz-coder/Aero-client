[package]
name = "aero-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
futures-util.workspace = true
zip.workspace = true
fs2.workspace = true
regex = "1.12"
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
minecraft-msa-auth = { version = "=0.5.0", default-features = false }
async-trait = "0.1"
subtle = "2.6"
png = "0.17"
sysinfo = { version = "0.40", default-features = false, features = [
    "system",
    "disk",
    "multithread",
] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "aero-cli"
path = "src/main.rs"
